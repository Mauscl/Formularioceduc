<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Encuestado</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <div>
          <h1>Encuestado</h1>
        </div>
      </div>
    </header>

    <main class="container respondent-layout">
      <section class="panel">
        <h2>Cuestionario</h2>
        <form id="survey-form">
          <label>
            Nombre o identificador
            <input type="text" id="respondent-name" placeholder="Ej: Ana López" />
          </label>

          <div id="questions-container" class="survey-questions"></div>

          <button type="submit" class="primary-btn">Enviar respuestas</button>
        </form>

        <div id="thank-you" class="success-box hidden"></div>
      </section>
    </main>

    <script src="/encuestado.js"></script>
  </body>
</html>
